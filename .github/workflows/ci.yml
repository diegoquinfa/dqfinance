name: CI

# main is production: a push to main migrates and deploys. Everything else
# only checks.
on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

# A new push cancels the previous run of the same ref, except on a branch that
# deploys: a production deploy is never cancelled halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Wrangler telemetry off in CI.
  WRANGLER_SEND_METRICS: 'false'

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Refuse committed focused tests
        run: |
          ! git grep -nE "\b(test|it|describe)\.only\(|only: true" -- '*.test.ts' '*.test.mjs'

      # No version: pnpm/action-setup reads the one pinned in package.json's packageManager field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check-types
      - run: pnpm test
      - run: pnpm build

  deploy:
    name: deploy-production
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
    steps:
      # Until the Cloudflare credentials exist, deploying is skipped with a
      # warning instead of failing main: the code is still checked and merged.
      - id: creds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::warning title=Production deploy skipped::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in Settings > Secrets and variables > Actions (see docs/branching.md)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.enabled == 'true'

      - uses: pnpm/action-setup@v4
        if: steps.creds.outputs.enabled == 'true'

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.enabled == 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        if: steps.creds.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile

      # `pnpm run deploy` reads dist/server/wrangler.json, generated by the build.
      - name: Build
        if: steps.creds.outputs.enabled == 'true'
        run: pnpm build

      # Applies the pending D1 migrations to the remote database, then deploys
      # the Worker. Same command as the documented manual path.
      - name: Migrate and deploy
        if: steps.creds.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run deploy
